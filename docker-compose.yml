services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: obe_system_app
    restart: unless-stopped
    # Dev resource caps — tránh spike CPU lúc boot.
    mem_limit: 768m
    cpus: 1.5
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - app-network

  web:
    image: nginx:alpine
    container_name: obe_system_web
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "8888:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: obe_system_db
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${DB_DATABASE:-obe_system}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Cổng HOST đổi được (DB_PORT_HOST trong .env) — máy dev chạy nhiều project Laravel
      # cùng lúc sẽ đụng 5432, khiến container db khởi động lỗi mạng và app không resolve
      # được host "db". Mặc định giữ nguyên 5432 nên prod không đổi gì.
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: obe_system_redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - redis-data:/data
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: obe_system_worker
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.0
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=3600 --memory=512
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - app-network

  # Worker riêng cho queue 'measurements' (đo lại CLO/PI/PLO do cascade sự kiện
  # điểm / nút "Tính lại toàn trường"). Tách khỏi queue 'default' để import/export
  # của người dùng không bị block khi có backlog đo lại.
  worker-measurements:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # KHÔNG đặt container_name cố định → cho phép `docker compose up --scale worker-measurements=N`
    # để chạy song song nhiều worker đo lường (mỗi lớp 1 job độc lập).
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.0
    command: php artisan queue:work redis --queue=measurements --sleep=3 --tries=3 --timeout=3600 --memory=512
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - app-network


  # Chạy lịch (schedule:work) — CẦN có để model:prune (dọn audit_logs/measurement_runs)
  # và dọn file export 30 ngày thực sự chạy. Thiếu service này = log phình vô hạn.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: obe_system_scheduler
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - app-network

  vite:
    image: node:20-alpine
    container_name: obe_system_vite
    working_dir: /var/www
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
